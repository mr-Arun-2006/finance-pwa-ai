version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finance_pwa_db
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: finance_pwa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finance_pwa_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: finance_pwa_api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://finance_user:secure_password_change_me@postgres:5432/finance_pwa
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_change_me
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    container_name: finance_pwa_ml
    environment:
      PYTHONUNBUFFERED: 1
      ML_PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./ml-models:/app
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 5000 --reload

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: finance_pwa_web
    environment:
      REACT_APP_API_URL: http://localhost:3001
      REACT_APP_ML_URL: http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: finance_pwa_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
